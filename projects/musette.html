<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Festival des Rives sonores — Nina Lê</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    /* Layout principal à deux colonnes */
    .project-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      align-items: start;
    }

    /* Colonne gauche : divisée en 2 sous-colonnes (5cm pour titre/meta, 1fr pour le texte) */
    .project-info {
      display: grid;
      grid-template-columns: 5cm 1fr;
      gap: 2rem;
      align-items: start;
    }

    /* Sous-colonne 1 (5cm) : Titre & Métadonnées */
    .project-meta-col {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      border: none;
      padding: 0;
    }

    .project-meta-col h1 {
      font-size: 16px;
      font-weight: normal; /* Titre non gras */
      margin: 0;
      line-height: 1.2;
    }

    .project-meta-col .facts {
      font-size: 13px;
      line-height: 1.6;
      opacity: 0.8;
    }

    /* Sous-colonne 2 : Texte descriptif + Bouton retour */
    .project-body-col {
      display: flex;
      flex-direction: column;
    }

    .project-body {
      font-size: 13px;
      line-height: 1.7;
      border-top: none;
      padding-top: 0;
      /* Ajustement du décalage pour s'aligner sous les métadonnées */
      margin-top: calc(16px + 0.5rem + (13px * 1.6 * 3));
    }

    .project-body p {
      margin: 0 0 1.2rem 0;
      text-align: justify;
    }

    .project-body p:last-child {
      margin-bottom: 0;
    }

    /* Lien de retour : positionné 1cm sous le texte */
    .back-link {
      align-self: flex-start;
      margin-top: 1cm;
      font-size: 0.95rem;
      text-decoration: none;
      opacity: 0.7;
      transition: opacity 0.3s ease;
      line-height: 1.2;
    }

    .back-link:hover {
      opacity: 1;
    }

    /* Colonne droite : images alignées à droite, hauteur 11cm, espacement de 0.3cm */
    .project-images {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.3cm;
    }

    .project-images img {
      height: 11cm;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      display: block;
    }

    /* Responsive : adaptation pour mobile et tablette */
    @media (max-width: 900px) {
      .project-info {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .project-body {
        margin-top: 0;
      }
    }

    @media (max-width: 768px) {
      .project-layout {
        grid-template-columns: 1fr;
        gap: 2rem;
      }

      .project-images {
        order: -1;
        align-items: stretch;
      }

      .project-images img {
        height: auto;
        width: 100%;
      }
    }
  </style>
</head>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise — Nina Lê</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>

<header class="site">
  <div class="wrap">
    <div class="logo"><a href="index.html">[N]</a></div>
    <nav>
      <a class="nav-label" href="architectures.html">Architectures</a>
      <a class="nav-label" href="pratiques-chantiers.html">Pratiques / Chantiers</a>
      <a class="nav-label" href="annexes.html">Annexes</a>
      <a class="nav-label active" href="surprise.html">Surprise</a>
      <a class="nav-label" href="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main class="wrap surprise-main">
  <div class="surprise-container">
    <!-- Image cliquable centrée -->
    <a href="#" id="surpriseLink" class="surprise-card">
      <img id="surpriseImage" src="" alt="Projet surprise">
      <span id="surpriseTitle" class="surprise-title"></span>
    </a>

    <!-- Bouton discret pour relancer une image sans recharger la page -->
    <button class="reload-btn" onclick="loadRandomProject()">[ Autre projet ]</button>
  </div>
</main>

<div id="custom-cursor"></div>
<script src="cursor.js"></script>

<script>
  // Liste des projets de ton portfolio
  const projects = [
    { title: "Projet 01", img: "projects/img/carte-visite/carte-visite-1.png", url: "architectures.html" },
    { title: "Projet 02", img: "projects/img/carte-visite/carte-visite-1.png", url: "pratiques-chantiers.html" },
    { title: "Projet 03", img: "projects/img/carte-visite/carte-visite-1.png", url: "annexes.html" }
  ];

  function loadRandomProject() {
    if (projects.length === 0) return;

    const card = document.querySelector('.surprise-card');
    
    // Réinitialise l'animation
    card.classList.remove('reveal');
    
    // Déclenche le tirage aléatoire après une micro-pause
    setTimeout(() => {
      const randomIndex = Math.floor(Math.random() * projects.length);
      const selected = projects[randomIndex];

      document.getElementById('surpriseImage').src = selected.img;
      document.getElementById('surpriseTitle').innerText = selected.title;
      document.getElementById('surpriseLink').href = selected.url;

      // Lance l'effet d'apparition
      card.classList.add('reveal');
    }, 50);
  }

  // Lancement automatique dès l'arrivée sur la page
  window.addEventListener('DOMContentLoaded', loadRandomProject);
</script>

</body>
</html>
